# Dependabot configuration.
#
# Every dependency here is a devDependency: the package ships lib/ and the
# committed dist/, and the toolchain below only builds, lints and tests them.
# A bump never rebuilds dist/. A rebuild under a newer toolchain is not
# byte-identical (newer browserslist data changes what Babel lowers), so
# rebuild and commit dist/ only on purpose.
#
# This repository is a fork. GitHub does not act on this file for a fork until
# Dependabot version updates are enabled in Settings > Code security.
#
# Minor and patch bumps arrive as one grouped PR. Majors stay ungrouped so each
# gets its own breaking-change review; they are NOT ignored, because that would
# hide a major-version security fix.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      dev-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # No workflow exists under .github/workflows yet, so this block has nothing to
  # update today. It is here so the first workflow added is covered from day one.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
